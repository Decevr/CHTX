<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CHTX</title>
  <link rel="icon" href="favicon.png?v=15">
  <link rel="stylesheet" href="styles.css?v=21">
</head>
<body>
  <header class="hero">
    <img class="banner" src="banner.jpg?v=17" alt="">
    <div class="hero-shade"></div>
    <img class="wordmark" src="wordmark.png?v=17" alt="CHTX">
    <p class="mark">DecervCo</p>
  </header>
  <div class="toolbar">
    <form class="finder" id="finder" role="search">
      <div class="searchbar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M16 16l4 4"></path></svg>
        <input id="search" type="search" placeholder="Search a character" aria-label="Search a character" autocomplete="off" enterkeyhint="search">
        <button type="button" id="clear-search" hidden aria-label="Clear search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg>
        </button>
      </div>
    </form>
    <p class="status" id="status"></p>
    <div class="category-menu" id="category-menu" hidden>
      <button type="button" id="category-toggle" aria-expanded="false" aria-haspopup="listbox">
        <span id="category-label">All</span>
        <span id="category-count"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <div class="category-panel" id="category-panel" role="listbox" hidden></div>
    </div>
  </div>
  <main id="main"></main>
  <nav class="dock" aria-label="Main menu">
    <button type="button" data-view="browse" class="is-on">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.6"></rect><rect x="14" y="3" width="7" height="7" rx="1.6"></rect><rect x="3" y="14" width="7" height="7" rx="1.6"></rect><rect x="14" y="14" width="7" height="7" rx="1.6"></rect></svg>
      <span>Browse</span>
    </button>
    <button type="button" data-view="categories">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="7" rx="1.6"></rect><rect x="3" y="14" width="8" height="7" rx="1.6"></rect><rect x="13" y="14" width="8" height="7" rx="1.6"></rect></svg>
      <span>Categories</span>
    </button>
    <button type="button" data-view="styles">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4.2-1.1L18.6 8.5a1.8 1.8 0 0 0 0-2.5l-.6-.6a1.8 1.8 0 0 0-2.5 0L5.1 15.8 4 20z"></path><path d="M13.2 6.8l4 4"></path></svg>
      <span>Style</span>
    </button>
  </nav>
  <section id="detail" hidden></section>
  <p class="toast" id="toast" hidden>Copied</p>
  <script src="catalog.js?v=15"></script>
  <script src="styles.js?v=1"></script>
  <script src="app.js?v=19"></script>
</body>
</html>
