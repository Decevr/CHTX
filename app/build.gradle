plugins {
    id "com.android.application"
}

android {
    namespace "com.decevr.promptassist"
    compileSdk 35

    defaultConfig {
        applicationId "com.decevr.promptassist"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
